# Configuração do cargo-deny para Auditoria de Dependências Enterprise - Albedo Browser

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib"
]
copyleft = "warn"
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["crates-io"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
