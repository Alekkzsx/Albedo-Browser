[package]
name = "albedo"
version = "0.1.0"
edition = "2021"
authors = ["AlbedoUser"]

[dependencies]
slint = { version = "1.9", features = ["raw-window-handle-06"] }
rfd = "0.14"
tokio = { version = "1", features = ["full"] }
raw-window-handle = "0.6.2"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
sysinfo = "0.38.1"
html5ever = "0.25"
kuchiki = "0.8"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
image = "0.25.9"
rquickjs = { version = "0.6", features = ["full-async", "chrono", "loader"] }
serde_json = "1.0"
taffy = "0.3"
cssparser = "0.36"
selectors = "0.35.0"
precomputed-hash = "0.1.1"
url = "2.5"

[build-dependencies]
slint-build = "1.9"
