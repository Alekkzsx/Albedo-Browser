name: 🚀 Enterprise CI / Code Quality & Security

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: 🧹 Linter & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

  security-audit:
    name: 🛡️ Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit Dependencies for Known Vulnerabilities
        uses: rustsec/audit-check-action@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-matrix:
    name: 🏗️ Build & Test (${{ matrix.os }})
    needs: [lint-and-format, security-audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Graphic System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Run Unit Tests
        run: cargo test --verbose

      - name: Compile Release Binary
        run: cargo build --release
