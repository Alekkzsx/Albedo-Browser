name: 🏷️ Conventional Commit Linter

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**'

jobs:
  lint-pr-title:
    name: 🔍 Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  lint-push-commits:
    name: 🔍 Validate Commits on Push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Commit Messages
        run: |
          COMMITS=$(cat << 'EOF'
          ${{ toJSON(github.event.commits) }}
          EOF
          )
          
          if [ -z "$COMMITS" ] || [ "$COMMITS" = "null" ] || [ "$COMMITS" = "[]" ]; then
            echo "✅ Nenhum commit no payload para analisar."
            exit 0
          fi

          echo "$COMMITS" | jq -c '.[]' > commits.jsonl
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?: .+"
          FAILED=0
          
          while read -r commit; do
            ID=$(echo "$commit" | jq -r '.id' | cut -c1-7)
            MSG=$(echo "$commit" | jq -r '.message' | head -n 1)
            
            # Ignora commits automáticos de merge e revert
            if echo "$MSG" | grep -qE "^Merge " || echo "$MSG" | grep -qE "^Revert "; then
              echo "⏭️  Ignorando commit automático: $ID"
              continue
            fi
            
            if ! echo "$MSG" | grep -qE "$REGEX"; then
              echo "::error::❌ Commit $ID inválido: '$MSG'"
              echo "👉 Formato esperado: tipo(escopo): descrição"
              FAILED=1
            else
              echo "✅ Commit $ID aprovado."
            fi
          done < commits.jsonl
          
          if [ $FAILED -eq 1 ]; then
            echo "::error::Bloqueando push! Um ou mais commits estão fora do padrão Conventional Commits."
            exit 1
          fi
