<!DOCTYPE html>
<html>
<head>
<style>
  .container { width: 400px; background-color: #eee; border: 1px solid #ccc; }
  .box { width: 100px; height: 100px; }
  .float-left { float: left; background-color: red; }
  .float-right { float: right; background-color: blue; }
  .clear-both { clear: both; background-color: green; }
  .text { background-color: yellow; }
</style>
</head>
<body>
  <div class="container">
    <div class="box float-left">Left Float</div>
    <div class="box float-right">Right Float</div>
    <div class="text">Text should drop or shrink depending on float.</div>
    <div class="box clear-both">Clear Both</div>
  </div>
</body>
</html>
