name: 🚀 Enterprise CI / Code Quality & Security

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: 🧹 Linter & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

  security-and-licenses:
    name: 🛡️ Security & Licensing Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Security Tools (cargo-deny & cargo-audit)
        run: |
          cargo install cargo-deny --locked || true
          cargo install cargo-audit --locked || true

      - name: Audit Dependencies (RustSec)
        run: cargo audit

      - name: Check Licensing & Banned Crates (cargo-deny)
        run: cargo deny check

  build-and-test:
    name: 🏗️ Build & Test (${{ matrix.os }})
    needs: [lint-and-format, security-and-licenses]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Graphic System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --all-targets --all-features

      - name: Run Unit & Integration Tests
        run: cargo test --all-features --verbose

      - name: Compile Release Binary
        run: cargo build --release
