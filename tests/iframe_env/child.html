<!DOCTYPE html>
<html>
<head>
    <title>Child Window</title>
</head>
<body style="background: lightblue;">
    <h2>Child</h2>
    <iframe src="grandchild.html" id="subframe"></iframe>
    <script>
        window.addEventListener("message", (e) => {
            console.log("CHILD RECEIVED: " + e.data);
            let p = document.createElement("p");
            p.textContent = "CHILD RECEIVED: " + e.data;
            document.body.appendChild(p);
            
            // Forward to parent
            if (window.parent) {
                window.parent.postMessage("Child acknowledges: " + e.data, "*");
            }
            
            // Forward to grandchild
            const sub = document.getElementById("subframe");
            if (sub && sub.contentWindow) {
                sub.contentWindow.postMessage("Message for grandchild", "*");
            }
        });
    </script>
</body>
</html>
