name: ACE-HTML Conformance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: HTML5 Compliance Gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build ACE Engine
      run: cargo build --lib --features ace_html_parser

    - name: Run Required ACE Conformance (100%)
      run: cargo test --test html5lib_tokenizer_harness ace_html_required_conformance_passes_100 -- --nocapture

    - name: Run Critical Lexer Regressions
      run: |
        cargo test --lib ace::html::lexer::tests::enters_rcdata_and_decodes_entities -- --nocapture
        cargo test --lib ace::html::lexer::tests::no_panic_on_short_malformed_fuzz_inputs -- --nocapture

    - name: Run Tree Builder Regressions
      run: cargo test --lib ace::html::tree_builder::tests:: -- --nocapture

    - name: Run Fragment Context Integration Regressions
      run: |
        cargo test --lib engine::dom_tests::test_inner_html_respects_table_context -- --nocapture
        cargo test --lib engine::dom_tests::test_inner_html_respects_textarea_context -- --nocapture
        cargo test --lib engine::dom_tests::test_import_html_fragment_uses_parent_context -- --nocapture
