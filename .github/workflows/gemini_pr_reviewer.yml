name: 🤖 Gemini Enterprise AI Code Reviewer

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gemini-review:
    name: 🧠 Enterprise Gemini PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Target Branch
        run: |
          TARGET="${{ github.base_ref }}"
          if [ -z "$TARGET" ]; then TARGET="main"; fi
          git fetch origin $TARGET

      - name: Gather PR Context (Diff & Commits)
        id: pr_context
        run: |
          TARGET="${{ github.base_ref }}"
          if [ -z "$TARGET" ]; then TARGET="main"; fi
          
          git diff origin/$TARGET...HEAD > pr_diff.txt
          DIFF_SIZE=$(wc -l < pr_diff.txt | awk '{print $1}')
          git log origin/$TARGET..HEAD --pretty=format:"- %s" > pr_commits.txt
          
          if [ "$DIFF_SIZE" -eq 0 ]; then
            echo "EMPTY_DIFF=true" >> $GITHUB_ENV
          else
            echo "EMPTY_DIFF=false" >> $GITHUB_ENV
          fi

      - name: Execute Gemini AI Code Review
        if: env.EMPTY_DIFF == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) {
            console.error("❌ GEMINI_API_KEY secret não configurada nas variáveis do repositório!");
            process.exit(1);
          }

          let diffContent = fs.readFileSync("pr_diff.txt", "utf8");
          if (diffContent.length > 35000) {
            diffContent = diffContent.substring(0, 35000) + "\n\n...[Diff truncado por limite de tamanho]...";
          }
          
          const commitsContent = fs.readFileSync("pr_commits.txt", "utf8");
          const prTitle = process.env.PR_TITLE || "Sem título";

          const systemPrompt = `Você é o Revisor de Código Principal e Arquiteto de Sistemas do Albedo Browser (motor de alta performance em Rust).

Sua revisão DEVE cobrir obrigatoriamente:
1. 🏷️ **Qualidade dos Commits e PR Title**: (TÍTULO: "${prTitle}"). Valide o padrão Conventional Commits.
2. 🐞 **Detecção de Erros e Falhas Lógicas**: Busque bugs, syntax errors e falhas de concorrência.
3. 🏛️ **Arquitetura & Organização**: Respeito à divisão modular (engine, network, ui, utils).
4. 🛡️ **Segurança & Rust Safety**: .unwrap() banido em produção.
5. ⚡ **Performance**: Abstrações de custo zero.

REGRA DE VEREDITO E BLOQUEIO:
No final de sua resposta, você DEVE incluir uma linha exata:
"VEREDITO: APROVADO" ou "VEREDITO: REJEITADO".
Se encontrar qualquer erro, violação ou uso de unwrap em prod, retorne "VEREDITO: REJEITADO".

REGRA DO BOTÃO DE CORREÇÃO (Suggested Changes):
Sempre que encontrar um erro no código, forneça a correção exata utilizando a tag markdown \`\`\`suggestion do GitHub:
\`\`\`suggestion
código corrigido aqui
\`\`\`

Estruture a resposta:
- **Resumo Executivo**
- **Análise de Commits**
- **Bugs & Sugestões de Correção** (Use blocos \`\`\`suggestion)
- **VEREDITO: [APROVADO/REJEITADO]**`;

          const payload = JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  { text: systemPrompt },
                  { text: "TÍTULO DA PR:\n" + prTitle + "\n\nCOMMITS NESTA PR:\n" + commitsContent + "\n\nDIFF DA PULL REQUEST:\n\n```diff\n" + diffContent + "\n```" }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 3500
            }
          });

          function callGemini(model) {
            return new Promise((resolve) => {
              const req = https.request(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Content-Length": Buffer.byteLength(payload)
                  }
                },
                (res) => {
                  let data = "";
                  res.on("data", (chunk) => data += chunk);
                  res.on("end", () => resolve({ statusCode: res.statusCode, data }));
                }
              );
              req.on("error", (e) => resolve({ statusCode: 500, data: e.message }));
              req.write(payload);
              req.end();
            });
          }

          async function main() {
            // Modelos Gemini atuais com suporte a fallback
            const models = [
              "gemini-3.6-flash",
              "gemini-3.1-pro",
              "gemini-3.5-flash",
              "gemini-2.0-flash",
              "gemini-1.5-flash",
              "gemini-1.5-pro"
            ];
            let response = null;

            for (const model of models) {
              console.log(`🤖 Solicitando revisão via modelo ${model}...`);
              response = await callGemini(model);
              if (response.statusCode === 200) {
                console.log(`✅ Sucesso na API do Gemini usando modelo ${model}!`);
                break;
              } else {
                console.warn(`⚠️ Modelo ${model} respondeu status ${response.statusCode}. Tentando próximo...`);
              }
            }

            if (!response || response.statusCode !== 200) {
              console.error("❌ Erro em todos os modelos da API do Gemini:", response ? response.data : "Sem resposta");
              process.exit(1);
            }

            const responseJson = JSON.parse(response.data);
            const reviewText = responseJson.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!reviewText) {
              console.error("Resposta nula da API Gemini:", response.data);
              process.exit(1);
            }

            fs.writeFileSync("review_comment.md", "## 🤖 Enterprise Gemini AI Review\n\n" + reviewText);

            if (reviewText.includes("VEREDITO: REJEITADO")) {
              fs.writeFileSync("review_status.txt", "fail");
            } else {
              fs.writeFileSync("review_status.txt", "pass");
            }
          }

          main();
          '

      - name: Publish Review Comment on GitHub PR
        if: env.EMPTY_DIFF == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('review_comment.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Enforce Merge Blocking on Rejection
        if: env.EMPTY_DIFF == 'false'
        run: |
          if [ -f review_status.txt ]; then
            STATUS=$(cat review_status.txt)
            if [ "$STATUS" == "fail" ]; then
              echo "❌ O revisor Gemini encontrou erros, violações de arquitetura ou falhas de segurança!"
              echo "❌ O Veredito foi REJEITADO. A Action está falhando para bloquear o Merge na branch Main."
              exit 1
            fi
          fi
