[workspace]
members = ["."]
resolver = "2"

[package]
name = "albedo"
version = "0.1.0"
edition = "2021"
authors = ["AlbedoUser"]

[lib]
name = "albedo"
path = "src/lib.rs"

[features]
default = ["ace_html_parser"]
ace_html_parser = []

[dependencies]
anyhow = "1.0.80"
slint = { version = "1.9", features = ["raw-window-handle-06"] }
serde_json = "1.0"
rfd = "0.14"
uuid = { version = "1.10", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
sysinfo = "0.32"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
raw-window-handle = "0.6.2"
html5gum = "0.5.7"
bumpalo = "3.16"
string-interner = "0.17"
html5ever = "0.39"          # WHATWG HTML5 tree builder (Adoption Agency, Foster Parenting, etc.)
markup5ever = "0.39"         # Infraestrutura compartilhada do html5ever
memchr = "2.7"               # SIMD-accelerated byte scanning (AVX2/SSE2/NEON)
lasso = "0.7"                # High-performance string interning
phf = { version = "0.11", features = ["macros"] }  # Perfect hash functions (compile-time)
reqwest = { version = "0.13.2", features = ["blocking", "json", "http2"] }
image = "0.25.9"
rquickjs = { version = "0.6", features = ["full-async", "loader"] }
taffy = "0.3"
cssparser = "0.36"
selectors = "0.35.0"
precomputed-hash = "0.1.1"
cosmic-text = "0.12.1"
albedo-jit = { path = "albedo-jit" }
resvg = "0.45.0"
usvg = "0.45.0"
tiny-skia = "0.11.4"
wgpu = "29.0"
rodio = "0.19"
tokio-tungstenite = "0.24"
futures-util = "0.3"
arboard = "3.4"
notify-rust = "4.11"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
brotli = "7.0"
zstd = "0.13"

# HTTP/3 via QUIC (Implementação real)
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
http = "1.2"
bytes = "1.11"
once_cell = "1.21"
lazy_static = "1.5"
fxhash = "0.2"
smol_str = "0.2" # Otimização para strings pequenas
encoding_rs = "0.8"
simdutf8 = "0.1"
bstr = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1.10"

# Otimizações FASE 4
smallvec = "1.13"          # Small attribute maps
memmap2 = "0.9"            # Memory-mapped files
criterion = "0.5"          # Benchmarking framework

[build-dependencies]
slint-build = "1.9"
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
proptest = "1.6"
iai-callgrind = "0.16"

[workspace.lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
panic = "deny"
too_many_lines = "warn"
too_many_fields = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
