[package]
name = "ace_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async & Concurrency
tokio = { version = "1.37", features = ["full"] }
rayon = "1.10"
crossbeam = "0.8"
parking_lot = "0.12"

# Data Structures
dashmap = "5.5"
bumpalo = "3.16"
rustc-hash = "1.1"
smol_str = "0.2"
ropey = "1.6"
string_cache = "0.8"

# Math & Geometry
euclid = "0.22"

# Observability & Errors
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"

[features]
default = []
debug-tools = []
