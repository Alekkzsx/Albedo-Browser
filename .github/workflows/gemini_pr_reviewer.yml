name: 🤖 Gemini Enterprise AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gemini-review:
    name: 🧠 Enterprise Gemini PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Target Branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Gather PR Context (Diff & Commits)
        id: pr_context
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          DIFF_SIZE=$(wc -l < pr_diff.txt | awk '{print $1}')
          git log origin/${{ github.base_ref }}..HEAD --pretty=format:"- %s" > pr_commits.txt
          
          if [ "$DIFF_SIZE" -eq 0 ]; then
            echo "EMPTY_DIFF=true" >> $GITHUB_ENV
          else
            echo "EMPTY_DIFF=false" >> $GITHUB_ENV
          fi

      - name: Execute Gemini AI Code Review
        if: env.EMPTY_DIFF == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) {
            console.error("❌ GEMINI_API_KEY secret não configurada nas variáveis do repositório!");
            process.exit(1);
          }

          let diffContent = fs.readFileSync("pr_diff.txt", "utf8");
          if (diffContent.length > 35000) {
            diffContent = diffContent.substring(0, 35000) + "\n\n...[Diff truncado]...";
          }
          
          const commitsContent = fs.readFileSync("pr_commits.txt", "utf8");
          const prTitle = process.env.PR_TITLE || "Sem título";

          const systemPrompt = `Você é o Revisor de Código Principal e Arquiteto de Sistemas do Albedo Browser.

Sua revisão DEVE cobrir obrigatoriamente:
1. 🏷️ **Qualidade dos Commits e PR Title**: (TÍTULO: "${prTitle}"). Valide o padrão Conventional Commits.
2. 🐞 **Detecção de Erros e Falhas Lógicas**: Busque bugs, syntax errors e falhas de concorrência.
3. 🏛️ **Arquitetura & Organização**.
4. 🛡️ **Segurança & Rust Safety**: .unwrap() banido em produção.
5. ⚡ **Performance**.

REGRA DE VEREDITO E BLOQUEIO:
No final de sua resposta, você DEVE obrigatoriamente incluir uma linha exata com o veredito:
"VEREDITO: APROVADO" ou "VEREDITO: REJEITADO".
Se você encontrar QUAISQUER bugs, violações de segurança, falhas arquiteturais ou uso de unwrap em produção, você DEVE retornar "VEREDITO: REJEITADO". 

REGRA DO BOTÃO DE CORREÇÃO (Suggested Changes):
Sempre que encontrar um erro no código, forneça a correção exata utilizando a tag markdown \`\`\`suggestion do GitHub.
Isso permitirá que o desenvolvedor clique no botão "Commit suggestion" no PR.
Exemplo:
\`\`\`suggestion
código corrigido perfeitamente aqui
\`\`\`

Estruture a resposta de forma analítica e agressiva na qualidade:
- **Resumo Executivo**
- **Análise de Commits**
- **Bugs & Sugestões de Correção** (Use blocos \`\`\`suggestion para as correções práticas)
- **VEREDITO: [APROVADO/REJEITADO]**`;

          const payload = JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  { text: systemPrompt },
                  { text: "TÍTULO DA PR:\n" + prTitle + "\n\nCOMMITS NESTA PR:\n" + commitsContent + "\n\nDIFF DA PULL REQUEST:\n\n```diff\n" + diffContent + "\n```" }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 3500
            }
          });

          const req = https.request(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            },
            (res) => {
              let data = "";
              res.on("data", (chunk) => data += chunk);
              res.on("end", () => {
                if (res.statusCode !== 200) {
                  console.error("Erro API Gemini:", res.statusCode, data);
                  process.exit(1);
                }
                const responseJson = JSON.parse(data);
                const reviewText = responseJson.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!reviewText) {
                  console.error("Resposta nula do Gemini:", data);
                  process.exit(1);
                }

                fs.writeFileSync("review_comment.md", "## 🤖 Enterprise Gemini AI Review\n\n" + reviewText);
                
                // Determina o status para travar o merge se houver rejeição
                if (reviewText.includes("VEREDITO: REJEITADO")) {
                  fs.writeFileSync("review_status.txt", "fail");
                } else {
                  fs.writeFileSync("review_status.txt", "pass");
                }
                
                console.log("Revisão enterprise gerada com sucesso!");
              });
            }
          );

          req.on("error", (e) => {
            console.error("Erro na requisição:", e);
            process.exit(1);
          });

          req.write(payload);
          req.end();
          '

      - name: Publish Review Comment on GitHub PR
        if: env.EMPTY_DIFF == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('review_comment.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Enforce Merge Blocking on Rejection
        if: env.EMPTY_DIFF == 'false'
        run: |
          if [ -f review_status.txt ]; then
            STATUS=$(cat review_status.txt)
            if [ "$STATUS" == "fail" ]; then
              echo "❌ O revisor Gemini encontrou erros, violações de arquitetura ou falhas de segurança!"
              echo "❌ O Veredito foi REJEITADO. A Action está falhando para bloquear o Merge na branch Main."
              exit 1
            fi
          fi
