<!DOCTYPE html>
<html>
<head>
    <title>Parent Window</title>
</head>
<body>
    <h1>Parent</h1>
    <iframe src="child.html" id="myframe"></iframe>
    <script>
        const frame = document.getElementById("myframe");
        // Using setTimeout because onload might not be fully reliable yet
        setTimeout(() => {
            if (frame.contentWindow) {
                frame.contentWindow.postMessage('Hello from parent!', '*');
            } else {
                console.log("No contentWindow found!");
            }
        }, 1000);
        
        window.addEventListener("message", (e) => {
            console.log("PARENT RECEIVED: " + e.data);
            // Append to body to verify visual test if needed later
            let p = document.createElement("p");
            p.textContent = "PARENT RECEIVED: " + e.data;
            document.body.appendChild(p);
        });
    </script>
</body>
</html>
