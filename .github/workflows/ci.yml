name: 🚀 Enterprise CI / Code Quality & Security

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: 🧹 Linter & Code Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        if: hashFiles('Cargo.lock') != ''
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo fmt --all -- --check
          else
            echo "💡 Cargo.toml não encontrado. Pulando verificação do rustfmt."
          fi

      - name: Run Clippy Linter (Strict)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --all-targets --all-features -- -D warnings
          else
            echo "💡 Cargo.toml não encontrado. Pulando verificação do clippy."
          fi

  security-and-licenses:
    name: 🛡️ Security & Licensing Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        if: hashFiles('Cargo.lock') != ''
        uses: Swatinem/rust-cache@v2

      - name: Install Security Tools (cargo-deny & cargo-audit)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo install cargo-deny --locked || true
            cargo install cargo-audit --locked || true
          else
            echo "💡 Cargo.toml não encontrado. Pulando instalação de ferramentas."
          fi

      - name: Audit Dependencies (RustSec)
        run: |
          if [ -f "Cargo.lock" ]; then
            cargo audit
          else
            echo "💡 Cargo.lock não encontrado. Pulando auditoria de vulnerabilidades."
          fi

      - name: Check Licensing & Banned Crates (cargo-deny)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo deny check
          else
            echo "💡 Cargo.toml não encontrado. Pulando verificação de licenças."
          fi

  build-and-test:
    name: 🏗️ Build & Test (${{ matrix.os }})
    needs: [lint-and-format, security-and-licenses]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Graphic System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        if: hashFiles('Cargo.lock') != ''
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo check --all-targets --all-features
          else
            echo "💡 Cargo.toml não encontrado. Pulando cargo check."
          fi

      - name: Run Unit & Integration Tests
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --all-features --verbose
          else
            echo "💡 Cargo.toml não encontrado. Pulando testes."
          fi

      - name: Compile Release Binary
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --release
          else
            echo "💡 Cargo.toml não encontrado. Pulando build de release."
          fi
