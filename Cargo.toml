[workspace]
members = ["."]
resolver = "2"

[package]
name = "albedo"
version = "0.1.0"
edition = "2021"
authors = ["AlbedoUser"]

[lib]
name = "albedo"
path = "src/lib.rs"

[dependencies]
slint = { version = "1.9", features = ["raw-window-handle-06"] }
rfd = "0.14"
tokio = { version = "1", features = ["full"] }
raw-window-handle = "0.6.2"
sysinfo = "0.38.1"
html5ever = "0.25"
kuchiki = "0.8"
reqwest = { version = "0.13.2", features = ["blocking", "json", "http2"] }
image = "0.25.9"
rquickjs = { version = "0.6", features = ["full-async", "loader"] }
taffy = "0.3"
cssparser = "0.36"
selectors = "0.35.0"
precomputed-hash = "0.1.1"
cosmic-text = "0.12.1"
albedo-jit = { path = "albedo-jit" }
resvg = "0.45.0"
usvg = "0.45.0"
tiny-skia = "0.11.4"
wgpu = "23.0"
rodio = "0.19"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio-tungstenite = "0.24"
futures-util = "0.3"
arboard = "3.4"
getrandom = "0.2"
sha2 = "0.10"
sha1 = "0.10"
notify-rust = "4.11"
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
flate2 = "1.0"
brotli = "7.0"
zstd = "0.13"
rand = "0.10.0"
lazy_static = "1.5.0"
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

# HTTP/3 via QUIC (Implementação real)
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
http = "1.2"
bytes = "1.11"

[build-dependencies]
slint-build = "1.9"
