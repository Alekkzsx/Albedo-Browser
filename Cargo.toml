[package]
name = "albedo"
version = "0.1.0"
edition = "2021"
authors = ["AlbedoUser"]

[dependencies]
slint = { version = "1.9", features = ["raw-window-handle-06"] }
rfd = "0.14"
tokio = { version = "1", features = ["full"] }
raw-window-handle = "0.6.2"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
sysinfo = "0.38.1"
html5ever = "0.25"
kuchiki = "0.8"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
image = "0.25.9"
rquickjs = { version = "0.6", features = ["full-async", "chrono", "loader"] }
serde_json = "1.0"
taffy = "0.3"
cssparser = "0.36"
selectors = "0.35.0"
precomputed-hash = "0.1.1"
url = "2.5"
cosmic-text = "0.12.1"
resvg = "0.45.0"
usvg = "0.45.0"
tiny-skia = "0.11.4"
wgpu = "23.0"
rodio = "0.19"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
arboard = "3.4"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
sha1 = "0.10"
notify-rust = "4.11"
thiserror = "1.0"
chrono = "0.4"
urlencoding = "2.1.3"

[build-dependencies]
slint-build = "1.9"
