name: 🏷️ Conventional Commit Linter

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  lint-commits:
    name: 🔍 Validate PR Title & Commits Format
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
